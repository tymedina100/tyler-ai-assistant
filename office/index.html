<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183239">
    <title>Tyler's Virtual Office</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TYLER AI ASSISTANT</p>
          <h1>Virtual Office</h1>
        </div>
        <div class="connection"><span class="pulse"></span><span id="connection-text">Checking in…</span></div>
      </header>

      <section class="dashboard" aria-live="polite">
        <section class="office-panel" aria-label="AI team office">
          <div class="office-header">
            <div>
              <h2>Today’s floor</h2>
              <p id="office-summary">Waiting for the group bot to open the office.</p>
            </div>
            <span class="plant" aria-hidden="true">✦</span>
          </div>
          <div id="office-floor" class="office-floor">
            <div class="waiting-card">
              <span class="waiting-lamp" aria-hidden="true"></span>
              <strong>Office doors are closed</strong>
              <p>Start <code>group_bot.py</code>, then this room will fill with your enabled agents.</p>
            </div>
          </div>
        </section>

        <aside class="activity-panel" aria-label="Recent office activity">
          <div class="activity-heading">
            <div>
              <p class="eyebrow">LIVE FEED</p>
              <h2>Office activity</h2>
            </div>
            <span id="event-count" class="event-count">0</span>
          </div>
          <ol id="event-log" class="event-log">
            <li class="empty-event">New group activity will appear here.</li>
          </ol>
        </aside>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
